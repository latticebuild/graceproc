name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      HK_MISE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
      - name: Prepare dependencies
        run: mise run bootstrap
      - name: Validate checks
        run: hk validate
      - name: Test checks
        run: hk test
      - name: Check files
        run: hk check --all --slow
      - name: Build artifacts
        run: bazel build //:artifacts
      - name: Test
        run: bazel test //:test
      - name: Select optional gates
        id: gates
        shell: nu --no-config-file {0}
        run: |
          let plan = (open ci.json)
          $"race=($plan.race)" | save --append $env.GITHUB_OUTPUT
      - name: Race tests
        if: runner.os != 'Windows' && steps.gates.outputs.race == 'true'
        run: bazel test //:race_test
