min_version = "2026.9.16"
[tools]
bazel = "9.2.0"
buildifier = "10.0.1"
go = "1.27.1"
"aqua:jdx/hk" = "2.0.0"
pkl = "0.32.1"
nu = "0.115.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
[tasks.bootstrap]
run = "git rev-parse --show-toplevel"

[tasks.docs]
run = "nu scripts/docs.nu"

[tasks.check-docs]
run = "nu scripts/docs.nu --check"
